# Dependency policy, enforced by `cargo deny check` locally and in CI.
#
#   cargo install cargo-deny --locked
#   cargo deny check
#
# Four checks run: known vulnerabilities (advisories), licence allowlist,
# duplicate or wildcard versions (bans), and where crates may come from
# (sources). The SBOM at sbom.cdx.json records what we ship; this file says
# what we are willing to ship.

[graph]
# Check every target the app builds for, not just the host.
targets = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# RustSec advisory database. Fails on any vulnerability, unmaintained crate
# or yanked version. Add an id to `ignore` only with a comment saying why.
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Each entry: { id = "RUSTSEC-YYYY-NNNN", reason = "..." }, plus a risk in
# docs/RISK-2026-001.json with an owner and a review trigger. Empty since
# DM-2026-006 removed the component behind RUSTSEC-2026-0192.
ignore = []

[licenses]
# Permissive licences only. Anything not listed fails the build, so a new
# dependency under a copyleft or unknown licence is caught at review time.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
# Several versions of one crate bloat the binary and widen the audit surface,
# but are usually transitive and not ours to fix, so warn rather than fail.
multiple-versions = "warn"
# A wildcard version means "whatever is newest", which defeats the lockfile
# review process.
wildcards = "deny"
# Workspace members reference each other by path, with no version. That is
# not a registry wildcard, so it is allowed.
allow-wildcard-paths = true
highlight = "all"

# Charter: this application never has network capability (GitHub issue #8).
# It is an IT security compliance demonstration, and "no network code" is a
# claim made in every Software Version Description. These are the crates
# that would make that claim false. A dependency that pulls one in, even
# transitively, fails CI.
deny = [
  { crate = "reqwest", reason = "HTTP client; charter forbids network capability (#8)" },
  { crate = "hyper", reason = "HTTP; charter forbids network capability (#8)" },
  { crate = "hyper-util", reason = "HTTP; charter forbids network capability (#8)" },
  { crate = "ureq", reason = "HTTP client; charter forbids network capability (#8)" },
  { crate = "attohttpc", reason = "HTTP client; charter forbids network capability (#8)" },
  { crate = "isahc", reason = "HTTP client; charter forbids network capability (#8)" },
  { crate = "surf", reason = "HTTP client; charter forbids network capability (#8)" },
  { crate = "curl", reason = "HTTP client; charter forbids network capability (#8)" },
  { crate = "curl-sys", reason = "HTTP client; charter forbids network capability (#8)" },
  { crate = "tungstenite", reason = "WebSocket; charter forbids network capability (#8)" },
  { crate = "tokio-tungstenite", reason = "WebSocket; charter forbids network capability (#8)" },
  { crate = "async-tungstenite", reason = "WebSocket; charter forbids network capability (#8)" },
  { crate = "quinn", reason = "QUIC transport; charter forbids network capability (#8)" },
  { crate = "rustls", reason = "TLS implies a network peer; charter forbids network capability (#8)" },
  { crate = "native-tls", reason = "TLS implies a network peer; charter forbids network capability (#8)" },
  { crate = "openssl", reason = "TLS implies a network peer; charter forbids network capability (#8)" },
  { crate = "openssl-sys", reason = "TLS implies a network peer; charter forbids network capability (#8)" },
  { crate = "socket2", reason = "raw sockets; charter forbids network capability (#8)" },
  { crate = "mio", reason = "socket polling; charter forbids network capability (#8)" },
  { crate = "hickory-resolver", reason = "DNS; charter forbids network capability (#8)" },
  { crate = "trust-dns-resolver", reason = "DNS; charter forbids network capability (#8)" },
]

# Crates we legitimately depend on that have optional networking. The crate
# is allowed; these features of it are not.
[[bans.features]]
crate = "tokio"
deny = ["net", "full"]

[[bans.features]]
crate = "web-sys"
deny = ["Request", "Response", "Headers", "WebSocket", "XmlHttpRequest", "EventSource", "RtcPeerConnection", "RtcDataChannel", "WebTransport"]

[sources]
# Only crates.io. A dependency pulled from an arbitrary git URL or a second
# registry is exactly the kind of thing a security review wants to see.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
