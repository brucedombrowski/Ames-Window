name: Windows

# Builds the Windows program on a Windows machine and packages it with its
# README, SBOM and licences. Called by CI on every pull request, so the
# Windows build is tested before merge, and by Release, which scans the
# package and publishes it.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build and test on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked -p ames-app
      - name: The program imports no networking library
        run: scripts/windows-imports.sh target/release/ames-window.exe
      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          commit="$(git rev-parse --short HEAD)"
          mkdir -p ames-window-windows-x64
          cp target/release/ames-window.exe sbom-windows.cdx.json LICENSE-MIT LICENSE-APACHE ames-window-windows-x64/
          sed -e "s/@VERSION@/$version/" -e "s/@COMMIT@/$commit/" \
            packaging/windows/README.txt > ames-window-windows-x64/README.txt
          ls -l ames-window-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ames-window-windows-x64
          path: ames-window-windows-x64/
          if-no-files-found: error
