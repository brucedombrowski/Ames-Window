name: CI

# The checks every change must pass before review (REQ-3.3). The Pages
# workflow repeats the tests before it deploys from main; this one runs them
# on pull requests, where a failure is cheapest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: The browser bundle builds
        run: scripts/web.sh
      - name: The bundle names no network API
        run: scripts/no-network.sh web/dist

  # The Windows program, built and tested on Windows. The package it produces
  # can be downloaded from the run, for trying a change before it is released.
  windows:
    uses: ./.github/workflows/windows.yml
