name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published advisories are caught even when nothing
    # in the repository changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-cyclonedx
        # Pinned: a different generator version can change the output bytes.
        run: cargo install cargo-cyclonedx --version 0.5.10 --locked
      - name: Regenerate and compare
        run: scripts/sbom.sh --check
      - name: Generate the Software Version Description
        run: scripts/svd.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-svd
          path: |
            sbom.cdx.json
            target/svd/*.md

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  no-network:
    name: No network code in our source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Charter check (issue 8)
        # deny.toml covers third-party crates. This covers our own code.
        run: |
          if grep -rnE 'std::net|TcpStream|TcpListener|UdpSocket|\.fetch\(|XmlHttpRequest|WebSocket' crates/; then
            echo "::error::Network code found. The charter forbids it; see issue #8." >&2
            exit 1
          fi
          echo "No network code in crates/."
