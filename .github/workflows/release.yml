name: Release

# Builds a release from a version tag (REQ-4.5; NIST SP 800-218 PS.3.1,
# NIST SP 800-53 Rev. 5 SR-4, SI-7(1)). Nothing here is run by hand:
#
#   scripts/release.sh vX.Y.Z    # bumps versions, moves the changelog, tags
#   git push origin main vX.Y.Z  # this workflow takes it from there
#
# It attaches to the GitHub Release: the web bundle, the SBOM, the Software
# Version Description generated at the tagged commit, SHA256SUMS over all of
# them, and a signed build-provenance attestation naming this commit and run.
# It then opens a pull request that files the SVD under docs/releases/ so
# deliveries are browsable in the tree (issue #10). The attached SVD is the
# authoritative one: it was generated from the tagged commit, and a file
# describing a commit cannot be inside that same commit.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the SVD lists every change since the previous tag

      - name: Tag must match the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version" >&2
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install generators
        run: |
          cargo install wasm-bindgen-cli --version 0.2.130 --locked
          cargo install cargo-cyclonedx --version 0.5.10 --locked

      - name: Test
        run: cargo test --workspace

      - name: Inventory and verification matrix are current
        run: |
          scripts/sbom.sh --check
          scripts/ver.sh --check

      - name: Build the web bundle
        run: |
          scripts/web.sh
          (cd web/dist && zip -r -X "../../ames-window-web.zip" .)

      - name: Software Version Description
        run: scripts/svd.sh "SVD-$TAG.md"

      - name: Checksums
        run: sha256sum ames-window-web.zip sbom.cdx.json "SVD-$TAG.md" > SHA256SUMS

      - name: Provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ames-window-web.zip
            sbom.cdx.json
            SVD-${{ github.ref_name }}.md
            SHA256SUMS

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          # The release notes are this version's changelog section.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" \
            --title "Ames Window $TAG" \
            --notes-file notes.md \
            --verify-tag \
            ames-window-web.zip sbom.cdx.json "SVD-$TAG.md" SHA256SUMS

      - name: File the SVD in docs/releases (pull request)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="release/svd-$TAG"
          git switch -c "$branch"
          mkdir -p docs/releases
          cp "SVD-$TAG.md" "docs/releases/SVD-$TAG.md"
          git add "docs/releases/SVD-$TAG.md"
          git commit -m "Record the Software Version Description for $TAG" \
            -m "Generated by scripts/svd.sh at the tagged commit and attached to the GitHub Release; this copy makes it browsable in the tree. Standard change under docs/configuration-management.md."
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Record the SVD for $TAG" \
            --body "Files the Software Version Description that the Release workflow generated and attached to the $TAG release. Standard change: documentation only. See issue #10."
