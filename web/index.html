<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ames Window</title>
  <meta name="description" content="The Ames window illusion, rendered in pure Rust compiled to WebAssembly.">
  <!--
    The browser enforces the charter here. Nothing may be loaded from, or
    sent to, anywhere but this site: no outside scripts, images, frames or
    connections, no inline script, no eval. `connect-src 'self'` is what lets
    the loader fetch the app's own .wasm; `wasm-unsafe-eval` lets it compile;
    `worker-src blob:` is the timer worker winit starts, which inherits this
    policy. A policy cannot stop a link the viewer chooses to follow.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; connect-src 'self'; worker-src blob:; base-uri 'none'; form-action 'none'">
  <!-- scripts/web.sh replaces the content with the commit the page was built from. -->
  <meta name="build" content="dev">
  <style>
    html, body { margin: 0; height: 100%; background: #161b24; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; outline: none; }
    noscript { color: #e8d9b5; font: 16px system-ui, sans-serif; padding: 2rem; display: block; }
    #feedback {
      position: fixed; right: 12px; bottom: 12px; z-index: 1;
      display: flex; align-items: center; gap: 8px;
      font: 13px system-ui, "Segoe UI", sans-serif; color: #e8d9b5;
      opacity: 0.75; transition: opacity 0.15s;
    }
    #feedback:hover, #feedback:focus-within { opacity: 1; }
    #feedback a { color: inherit; text-underline-offset: 3px; }
    #feedback a:focus-visible { outline: 2px solid #5ec8ff; outline-offset: 3px; border-radius: 2px; }
  </style>
</head>
<body>
  <noscript>This page needs JavaScript to load the WebAssembly module.</noscript>
  <div id="feedback" role="group" aria-label="How does it look?">
    <span id="rate" title="Frames drawn per second"></span>
    <a id="report" href="https://github.com/brucedombrowski/Ames-Window/issues/new" target="_blank" rel="noopener" title="Opens a GitHub issue form in a new tab">Report feedback</a>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
