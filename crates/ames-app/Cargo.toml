[package]
name = "ames-app"
description = "The Ames window illusion as a pure-Rust iOS (and desktop) application."
# An application, never published to crates.io.
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ames-window"
path = "src/main.rs"

[dependencies]
ames-core = { path = "../ames-core" }
softbuffer = "0.4"
tiny-skia = "0.12"
# Default features minus wayland-csd-adwaita, which pulls a font parser
# (ab_glyph -> ttf-parser, RUSTSEC-2026-0192) only to draw the window title on
# Wayland. The -notitle variant draws the same decorations without text.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

[lints]
workspace = true

# The browser build. Everything here is pure Rust too; `web-time` is a
# drop-in `std::time` for WebAssembly, where the real one has no clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
web-time = "1"
