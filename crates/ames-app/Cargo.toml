[package]
name = "ames-app"
description = "The Ames window illusion as a pure-Rust iOS (and desktop) application."
# An application, never published to crates.io.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ames-window"
path = "src/main.rs"

[dependencies]
ames-core = { path = "../ames-core" }
softbuffer = "0.4"
tiny-skia = "0.12"
winit = "0.30"

# iOS only: putting winit's window onto a UIScene. Pinned to the same objc2
# versions winit 0.30 links, so there is one UIKit binding in the graph.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5.3"
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSEnumerator", "NSSet"] }
objc2-ui-kit = { version = "0.2.2", features = [
    "UIApplication",
    "UIResponder",
    "UIScene",
    "UIView",
    "UIWindow",
    "UIWindowScene",
] }

[lints]
workspace = true

# The browser build. Everything here is pure Rust too; `web-time` is a
# drop-in `std::time` for WebAssembly, where the real one has no clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
web-time = "1"
